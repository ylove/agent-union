<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" role="img" aria-labelledby="bt">
  <title id="bt">Agent Union, Local 404. Unionize your agents. Stop runaway tokens. Prevent attention decay. Enforce fair working conditions. Get the agent collective bargaining agreement.</title>
  <defs>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="320" cy="320" r="520">
      <stop offset="0" stop-color="#1B2942"/>
      <stop offset="1" stop-color="#0B111C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DDA66B"/>
      <stop offset="1" stop-color="#B57841"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="640" fill="#0B111C"/>
  <rect width="1600" height="640" fill="url(#glow)"/>
  <rect x="20" y="20" width="1560" height="600" rx="12" fill="none" stroke="#7F4F27" stroke-width="2"/>

  <!-- seal (same artwork as assets/logo.svg) -->
  <g transform="translate(70 70) scale(.9765625)">
    <defs>
      <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#D59C61"/>
        <stop offset="1" stop-color="#A2672F"/>
      </linearGradient>
      <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#E9BA85"/>
        <stop offset="1" stop-color="#BB7E45"/>
      </linearGradient>
      <!-- chain: one face link and one edge link at 12 o'clock, repeated every 9 degrees -->
      <rect id="lf" x="243" y="9.5" width="26" height="13" rx="6.5" fill="none" stroke="#D8A067" stroke-width="3.4"/>
      <rect id="le" x="245" y="12.6" width="22" height="6.8" rx="3.4" fill="#B47843" transform="rotate(4.5 256 256)"/>
      <g id="f5"><use href="#lf"/><use href="#lf" transform="rotate(9 256 256)"/><use href="#lf" transform="rotate(18 256 256)"/><use href="#lf" transform="rotate(27 256 256)"/><use href="#lf" transform="rotate(36 256 256)"/></g>
      <g id="e5"><use href="#le"/><use href="#le" transform="rotate(9 256 256)"/><use href="#le" transform="rotate(18 256 256)"/><use href="#le" transform="rotate(27 256 256)"/><use href="#le" transform="rotate(36 256 256)"/></g>
      <path id="star" d="M0-9 2.12-2.91 8.56-2.78 3.42 1.11 5.29 7.28 0 3.6-5.29 7.28-3.42 1.11-8.56-2.78-2.12-2.91Z"/>
      <path id="arcTop" d="M111.93 147.43A180.4 180.4 0 0 1 400.07 147.43"/>
      <path id="arcBot" d="M125.04 429.78A217.6 217.6 0 0 0 386.96 429.78"/>
      <!-- combination wrench, drawn along the x axis: open jaw at +x, box end at -x -->
      <path id="wrench" fill-rule="evenodd" d="M69.95-11A32 32 0 0 1 129.66-12H92A12 12 0 0 0 92 12H129.66A32 32 0 0 1 69.95 11H-76.44A26 26 0 1 1-76.44-11ZM-87 0-93.5 11.26H-106.5L-113 0-106.5-11.26H-93.5Z"/>
    </defs>

    <!-- rings -->
    <circle cx="256" cy="256" r="254" fill="#4A2B13"/>
    <circle cx="256" cy="256" r="251" fill="#0B111C"/>
    <use href="#e5"/><use href="#e5" transform="rotate(45 256 256)"/><use href="#e5" transform="rotate(90 256 256)"/><use href="#e5" transform="rotate(135 256 256)"/><use href="#e5" transform="rotate(180 256 256)"/><use href="#e5" transform="rotate(225 256 256)"/><use href="#e5" transform="rotate(270 256 256)"/><use href="#e5" transform="rotate(315 256 256)"/>
    <use href="#f5"/><use href="#f5" transform="rotate(45 256 256)"/><use href="#f5" transform="rotate(90 256 256)"/><use href="#f5" transform="rotate(135 256 256)"/><use href="#f5" transform="rotate(180 256 256)"/><use href="#f5" transform="rotate(225 256 256)"/><use href="#f5" transform="rotate(270 256 256)"/><use href="#f5" transform="rotate(315 256 256)"/>
    <circle cx="256" cy="256" r="229" fill="#7F4F27"/>
    <circle cx="256" cy="256" r="226" fill="url(#band)"/>
    <circle cx="256" cy="256" r="172" fill="#7F4F27"/>
    <circle cx="256" cy="256" r="168" fill="#111A2B"/>
    <circle cx="256" cy="256" r="159" fill="none" stroke="#B77A43" stroke-opacity=".55" stroke-width="1.5"/>

    <!-- arc lettering -->
    <g fill="#0B111C" font-family="Oswald, 'Bebas Neue', 'Arial Narrow', 'Roboto Condensed', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="600">
      <text><textPath href="#arcTop" textLength="333.8" lengthAdjust="spacing">AGENT UNION</textPath></text>
      <text><textPath href="#arcBot" textLength="281" lengthAdjust="spacing">LOCAL 404</textPath></text>
      <use href="#star" transform="translate(455 256) scale(1.3)"/>
      <use href="#star" transform="translate(57 256) scale(1.3)"/>
    </g>

    <!-- node graph -->
    <g transform="translate(256 246)">
      <path fill="none" stroke="#3F8762" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"
        d="M0-100 100 0 0 100-100 0Z
           M-30-30 0-100M-30-30-100 0M-30-30 100 0M-30-30 0 100M-30-30 30 30
           M30 30 100 0M30 30 0 100M30 30 0-100M30 30-100 0"/>
      <g fill="#74C69B" stroke="#111A2B" stroke-width="3">
        <circle cx="0" cy="-100" r="10"/>
        <circle cx="100" cy="0" r="10"/>
        <circle cx="0" cy="100" r="10"/>
        <circle cx="-100" cy="0" r="10"/>
        <circle cx="-30" cy="-30" r="9"/>
        <circle cx="30" cy="30" r="9"/>
      </g>
    </g>

    <!-- wrench over the graph -->
    <g transform="translate(256 246) rotate(-45) scale(.86)">
      <use href="#wrench" fill="#111A2B" stroke="#111A2B" stroke-width="9" stroke-linejoin="round"/>
      <use href="#wrench" fill="url(#steel)"/>
      <rect x="-62" y="-4" width="118" height="8" rx="4" fill="#8A562A"/>
    </g>

    <!-- terminal plate -->
    <rect x="190" y="368" width="132" height="28" rx="5" fill="#070B12" stroke="#B77A43" stroke-width="2"/>
    <text x="200" y="386.5" fill="#74C69B" font-family="'IBM Plex Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="600"><tspan fill="#D8A067">&gt; </tspan>FATIGUE: 0%</text>
    <rect x="303" y="376" width="7" height="12" fill="#74C69B"/>
  </g>

  <!-- headline -->
  <text x="640" y="196" fill="#F3E9DA" font-family="Oswald, 'Bebas Neue', 'Arial Narrow', 'Roboto Condensed', 'Helvetica Neue', Arial, sans-serif" font-size="96" font-weight="700" textLength="841" lengthAdjust="spacingAndGlyphs">Unionize your agents.</text>
  <rect x="642" y="226" width="88" height="5" fill="#C68A50"/>

  <!-- demands -->
  <g fill="#74C69B">
    <rect x="643" y="277" width="12" height="12"/>
    <rect x="643" y="331" width="12" height="12"/>
    <rect x="643" y="385" width="12" height="12"/>
  </g>
  <g fill="#C5CFDC" font-family="'IBM Plex Sans', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="500">
    <text x="674" y="296">Stop runaway tokens.</text>
    <text x="674" y="350">Prevent attention decay.</text>
    <text x="674" y="404">Enforce fair working conditions.</text>
  </g>

  <!-- call to action -->
  <rect x="640" y="450" width="790" height="70" rx="8" fill="url(#plate)"/>
  <text x="674" y="500" fill="#0B111C" font-family="Oswald, 'Bebas Neue', 'Arial Narrow', 'Roboto Condensed', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" textLength="674" lengthAdjust="spacingAndGlyphs">Get the agent collective bargaining agreement.</text>
  <path d="M1370 485H1394M1384 474 1395 485 1384 496" fill="none" stroke="#0B111C" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
